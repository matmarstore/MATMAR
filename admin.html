<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>MATMAR · Administración</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<style>
:root{--s:#0F3460;--f:#EEF2FF;--ln:#d3dcf3;--mu:#5b6f94}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--s);font:400 16px/1.5 system-ui,-apple-system,sans-serif}
header{background:var(--s);color:var(--f);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:.1em}header a{color:var(--f)}
main{max-width:820px;margin:0 auto;padding:16px}h2{margin:16px 0 8px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:6px;background:var(--f);font:inherit;color:inherit}
label{display:block;font-weight:600;margin:10px 0 3px;font-size:14px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .w{grid-column:1/-1}
.b{background:var(--s);color:var(--f);border:0;border-radius:6px;padding:12px 20px;font:700 15px inherit;cursor:pointer}.b.o{background:none;color:var(--s);border:1px solid var(--s)}.b.r{background:#a12d2d}
.it{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:8px 0}.it img,.it .n{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--f);flex:none}.it div{flex:1;min-width:0}.it small{color:var(--mu)}
.it .a{display:flex;gap:6px;flex-wrap:wrap;flex:none}.it .a button{padding:8px 12px;font-size:14px}
.ck{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}.ck label{display:flex;gap:6px;align-items:center;font-weight:400}.ck input{width:auto}
.th{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.th img{width:72px;height:72px;object-fit:cover;border-radius:6px}.th div{position:relative}.th i{position:absolute;top:-6px;right:-6px;background:#a12d2d;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;cursor:pointer}
#tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--s);color:var(--f);padding:12px 20px;border-radius:24px;display:none;max-width:90%;text-align:center}
</style></head><body>
<header><b>MATMAR · ADMIN</b><a href="./" target="_blank">Ver catálogo</a></header>
<main id="m"></main><div id="tt"></div>
<script>
const O=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'ftomarceballos94-hash',R=location.hostname.endsWith('.github.io')?(location.pathname.split('/')[1]||'MATMAR'):'MATMAR',API=`https://api.github.com/repos/${O}/${R}/contents/`;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T='',D=null,SHA='',ed=null,PV={};try{T=localStorage.getItem('mm_tk')||''}catch(e){}
const H=()=>({Authorization:'Bearer '+T,Accept:'application/vnd.github+json'}),b64=s=>btoa(unescape(encodeURIComponent(s))),unb=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const tt=(m,ms=3500)=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',ms)};
async function load(){const r=await fetch(API+'products.json?ref=main&t='+Date.now(),{headers:H()});if(!r.ok)throw new Error(r.status);const j=await r.json();SHA=j.sha;D=JSON.parse(unb(j.content));D.productos=D.productos||[]}
async function commit(msg){const r=await fetch(API+'products.json',{method:'PUT',headers:H(),body:JSON.stringify({message:msg,content:b64(JSON.stringify(D,null,2)),sha:SHA,branch:'main'})});if(!r.ok)throw new Error(r.status);SHA=(await r.json()).content.sha;tt('Guardado. Se verá en el catálogo en 1 o 2 minutos.',5000)}
function login(){$('#m').innerHTML=`<h2>Entrar</h2><p>Pega aquí tu token de GitHub (solo se guarda en este dispositivo).</p><input id="tk" type="password" placeholder="github_pat_..."><p><button class="b" onclick="saveTk()">Entrar</button></p>`}
async function saveTk(){T=$('#tk').value.trim();try{await load();try{localStorage.setItem('mm_tk',T)}catch(e){}list()}catch(e){T='';tt('Token no válido o sin permisos ('+e.message+')')}}
function list(){ed=null;const P=D.productos;$('#m').innerHTML=`<p><button class="b" onclick="frm()">+ Agregar producto</button></p><h2>Productos (${P.length})</h2>`+(P.map((p,i)=>`<div class="it">${(p.fotos||[])[0]?`<img src="${esc(p.fotos[0])}" alt="">`:'<div class="n"></div>'}<div><b>${esc(p.nombre)}</b><br><small>${esc(p.marca)} · $${p.precio} · ${p.disponible===false?'Agotado':'Disponible'}</small></div><div class="a"><button class="b o" onclick="frm(${i})">Editar</button><button class="b o" onclick="tog(${i})">${p.disponible===false?'Disponible':'Agotar'}</button><button class="b r" onclick="del(${i},this)">Eliminar</button></div></div>`).join('')||'<p>Aún no hay productos.</p>')+`<h2>Datos de contacto</h2><label>WhatsApp (con lada, ej. 522283341780)</label><input id="cw" value="${esc(D.whatsapp)}"><label>Instagram (enlace, opcional)</label><input id="ci" value="${esc(D.instagram)}"><p><button class="b" onclick="saveC()">Guardar contacto</button> <button class="b o" onclick="out()">Salir</button></p>`}
async function wrap(f,m){try{await f();await commit(m);list()}catch(e){tt('No se pudo guardar ('+e.message+'). Recarga e intenta de nuevo.')}}
const tog=i=>wrap(async()=>{await load();const p=D.productos[i];p.disponible=p.disponible===false;},'Cambio de disponibilidad');
function del(i,b){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='¿Seguro?';return}wrap(async()=>{await load();D.productos.splice(i,1)},'Producto eliminado')}
const saveC=()=>wrap(async()=>{await load();D.whatsapp=$('#cw').value.trim();D.instagram=$('#ci').value.trim()},'Contacto');
function out(){try{localStorage.removeItem('mm_tk')}catch(e){}T='';login()}
function frm(i){const p=i==null?{fotos:[],disponible:true}:JSON.parse(JSON.stringify(D.productos[i]));ed={i,p};const v=k=>esc(Array.isArray(p[k])?p[k].join(', '):p[k]);
 $('#m').innerHTML=`<h2>${i==null?'Nuevo producto':'Editar producto'}</h2><div class="g"><div class="w"><label>Nombre</label><input id="an" value="${v('nombre')}"></div><div><label>Marca</label><input id="ab" list="lb" value="${v('marca')}"></div><div><label>Categoría</label><input id="ac" list="lc" value="${v('categoria')}"></div><div class="w"><label>Descripción</label><textarea id="ad" rows="3">${v('descripcion')}</textarea></div><div><label>Precio</label><input id="ap" type="number" inputmode="numeric" value="${v('precio')}"></div><div><label>Precio de promoción (opcional)</label><input id="ao" type="number" inputmode="numeric" value="${p.promo||''}"></div><div><label>Tallas (separadas por coma)</label><input id="az" value="${v('tallas')}"></div><div><label>Colores (separados por coma)</label><input id="ak" value="${v('colores')}"></div></div>
 <datalist id="lb">${[...new Set(D.productos.map(x=>x.marca))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="lc">${[...new Set(D.productos.map(x=>x.categoria))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <div class="ck"><label><input id="ao2" type="checkbox" ${p.disponible!==false?'checked':''}>Disponible</label><label><input id="af" type="checkbox" ${p.destacado?'checked':''}>Destacado</label><label><input id="an2" type="checkbox" ${p.nuevo?'checked':''}>Nuevo</label><label><input id="am" type="checkbox" ${p.masvendido?'checked':''}>Más vendido</label></div>
 <label>Fotografías (puedes elegir varias; la primera es la principal)</label><input type="file" accept="image/*" multiple onchange="up(this)"><div class="th" id="th"></div><p><button class="b" onclick="saveP()">Guardar producto</button> <button class="b o" onclick="list()">Cancelar</button></p>`;thumbs()}
const thumbs=()=>$('#th').innerHTML=ed.p.fotos.map((u,k)=>`<div><img src="${esc(PV[u]||u)}" alt=""><i onclick="ed.p.fotos.splice(${k},1);thumbs()">×</i></div>`).join('');
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.onerror=no;i.src=URL.createObjectURL(f)})}
async function up(inp){for(const f of inp.files){try{tt('Subiendo foto...',20000);const d=await shrink(f),path='fotos/'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+'.jpg',r=await fetch(API+path,{method:'PUT',headers:H(),body:JSON.stringify({message:'Foto',content:d.split(',')[1],branch:'main'})});if(!r.ok)throw new Error(r.status);PV[path]=d;ed.p.fotos.push(path);thumbs();tt('Foto subida')}catch(e){tt('No se pudo subir una foto ('+e.message+')')}}inp.value=''}
function saveP(){const g=i=>$('#'+i).value.trim(),l=i=>g(i).split(',').map(x=>x.trim()).filter(Boolean),n=g('an');if(!n)return tt('Falta el nombre');
 const p={...ed.p,nombre:n,marca:g('ab'),categoria:g('ac'),descripcion:g('ad'),precio:+g('ap')||0,promo:+g('ao')||0,tallas:l('az'),colores:l('ak'),disponible:$('#ao2').checked,destacado:$('#af').checked,nuevo:$('#an2').checked,masvendido:$('#am').checked};
 if(!p.id)p.id=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)+'-'+Date.now().toString(36).slice(-4);
 const i=ed.i;wrap(async()=>{await load();if(i==null)D.productos.push(p);else D.productos[i]=p},'Producto: '+n)}
(async()=>{if(!T)return login();try{await load();list()}catch(e){T='';login();tt('Vuelve a pegar tu token ('+e.message+')')}})();
</script></body></html>
